name: GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - assets/**
      - docs/**
      - _config.yml
      - _layouts/**
      - .github/workflows/pages.yml
  pull_request:
    branches:
      - main
    paths:
      - index.html
      - assets/**
      - docs/**
      - _config.yml
      - _layouts/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Stage website and documentation
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          test -f index.html
          test -d assets
          test -f docs/index.md
          test -f _config.yml
          test -f _layouts/docs.html

          mkdir -p _pages_source
          cp index.html _pages_source/index.html
          cp -R assets _pages_source/assets
          cp -R docs _pages_source/docs
          cp _config.yml _pages_source/_config.yml
          cp -R _layouts _pages_source/_layouts

          printf 'baseurl: "%s"\n' "$PAGES_BASE_PATH" >> _pages_source/_config.yml

          while IFS= read -r -d '' page; do
            if [ "$(head -n 1 "$page")" != "---" ]; then
              temporary="${page}.tmp"
              {
                printf '%s\n' '---' 'layout: docs' '---'
                cat "$page"
              } > "$temporary"
              mv "$temporary" "$page"
            fi
          done < <(find _pages_source/docs -type f -name '*.md' -print0)

      - name: Render Markdown documentation
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_pages_source
          destination: ./_site

      - name: Verify rendered site
        run: |
          test -f _site/index.html
          test -f _site/docs/index.html
          test -d _site/assets

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
