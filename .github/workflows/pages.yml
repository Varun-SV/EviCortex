name: GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - assets/**
      - docs/**
      - tools/**
      - .github/workflows/pages.yml
  pull_request:
    branches:
      - main
    paths:
      - index.html
      - assets/**
      - docs/**
      - tools/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site from docs/*.md
        run: |
          python -m pip install --disable-pip-version-check "markdown>=3.5,<4" "pygments>=2.17,<3"
          python tools/build_site.py

      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R assets docs _site/
          test -f _site/docs/index.html
          test -f _site/assets/ev-scene.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
